[package]
name = "mutemic"
version = "0.2.2"
edition = "2024"
description = "A native Windows tray app for one selected capture endpoint."

[[bin]]
name = "mutemic"
path = "src/main.rs"

[[bin]]
name = "ui-check"
path = "tools/ui-check.rs"
test = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant", "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_Multimedia",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
  "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Threading",
  "Win32_System_RemoteDesktop", "Win32_Security", "Win32_Storage_Xps"
] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
